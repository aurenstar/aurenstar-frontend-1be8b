<!doctype html>
<html lang="en" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <!-- Browsers with JavaScript never flash the plain page text; search engines and no-JS readers still get it. -->
    <script>document.documentElement.classList.add("js")</script>
    <style>html.js #root>main[data-prerendered]{visibility:hidden}html.js body{background:#C9E5FF}</style>
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#C9E5FF" />
    <link rel="icon" type="image/png" href="/aurenstar-avatar.png" />
    <link rel="apple-touch-icon" href="/aurenstar-avatar.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="image" href="/logo-aurenstar.webp" type="image/webp">
    <!-- Only Montserrat is used (internal pages); load it without blocking the first paint. -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet"></noscript>
    <!--
      SEO tags (title, description, canonical, robots, Open Graph, Twitter, JSON-LD) are
      generated per route at build time by scripts/prerender.ts and replace the marker
      below. In dev they are applied at runtime by src/utils/seo.ts.
    -->
    <title>Aurenstar | Simple Astrology, Daily Guidance &amp; Zodiac Insights</title>
    <!--seo-head-->
  </head>
  <body>
    <div id="root"></div>
    <!--seo-noscript-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
