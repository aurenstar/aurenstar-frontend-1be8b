name: Site check
# Saves GitHub minutes: only the main branch and pull requests, never for robot commits that only add data files,
# and a newer run cancels the older one for the same branch.
on:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'src/data/**', 'public/**', '**.md']
  pull_request:
    paths-ignore: ['data/**', 'src/data/**', 'public/**', '**.md']
concurrency:
  group: site-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: package.json }
      - run: npm install --legacy-peer-deps
      - run: npm install --no-save --legacy-peer-deps playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:smoke
      - run: npm run test:engine
