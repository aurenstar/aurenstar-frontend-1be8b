name: Article translations
# TURNED OFF by the owner on 2026-11-21 (no automatic start any more; the site translates on its own). It can still be run by hand (Run workflow).
on:
  workflow_dispatch:
  push:
    branches: [seo-tecnico]
    paths: ['data/articles-run.trigger']   # touch this file to run it now
permissions:
  contents: write
concurrency:
  group: article-translations
  cancel-in-progress: false
jobs:
  # Factory gate: the n8n factory decides if this routine may run (pause + per-routine switch in the database). Manual runs always go.
  porteiro:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.p.outputs.run }}
    steps:
      - id: p
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "push" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          R=$(curl -sS --max-time 30 -X POST "https://bnetpqdpeufookvvsnaj.supabase.co/rest/v1/rpc/site_github_pode_rodar" -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJuZXRwcWRwZXVmb29rdnZzbmFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NjMyMjQsImV4cCI6MjEwNjAzOTIyNH0.wt2vuHS_f4DirYlqrly-6BcA6FsmeL9mwemWm12n6hk" -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJuZXRwcWRwZXVmb29rdnZzbmFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NjMyMjQsImV4cCI6MjEwNjAzOTIyNH0.wt2vuHS_f4DirYlqrly-6BcA6FsmeL9mwemWm12n6hk" -H "Content-Type: application/json" -d '{"p_job":"articles"}' || echo '{"run":false,"motivo":"sem resposta da fabrica"}')
          echo "Factory answer: $R"
          if echo "$R" | grep -Eq '"run": *true'; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
  translate:
    # when started by the WordPress sync, only go on if that sync worked
    needs: porteiro
    if: needs.porteiro.outputs.run == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # translations go to the live site branch
      - name: Did the sync bring anything new?
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SYNC_STARTED: ${{ github.event.workflow_run.run_started_at }}
        run: |
          go=true
          if [ "$EVENT" = "workflow_run" ]; then
            # only go on if the sync saved a new commit after it started (no news = nothing to translate)
            who=$(git log -1 --format=%an)
            when=$(git log -1 --format=%cI)
            if [ "$who" = "aurenstar-sync" ] && [ "$(date -d "$when" +%s)" -ge "$(date -d "$SYNC_STARTED" +%s)" ]; then go=true; else go=false; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - if: steps.gate.outputs.go == 'true'
        run: npm install --legacy-peer-deps
      - name: Translate articles (skips quietly if the key is not set)
        if: steps.gate.outputs.go == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run articles:translate -- --max ${{ github.event_name == 'push' && '30' || '8' }}
      - name: Check before saving
        if: steps.gate.outputs.go == 'true'
        run: npx tsc --noEmit
      - name: Save
        if: steps.gate.outputs.go == 'true'
        run: |
          if [ -n "$(git status --porcelain data/article-translations)" ]; then
            git config user.name "aurenstar-bot"
            git config user.email "bot@aurenstar.com"
            git add data/article-translations
            git commit -m "Articles: new translations"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
