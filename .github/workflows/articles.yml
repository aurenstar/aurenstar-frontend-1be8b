name: Article translations
on:
  workflow_run:
    workflows: ['WordPress sync']   # right after new posts arrive from WordPress
    types: [completed]
  schedule:
    - cron: '47 7 * * *'   # safety net: once a day
  workflow_dispatch:
  push:
    branches: [seo-tecnico]
    paths: ['data/articles-run.trigger']   # touch this file to run it now
permissions:
  contents: write
concurrency:
  group: article-translations
  cancel-in-progress: false
jobs:
  translate:
    # when started by the WordPress sync, only go on if that sync worked
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # translations go to the live site branch
      - name: Did the sync bring anything new?
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SYNC_STARTED: ${{ github.event.workflow_run.run_started_at }}
        run: |
          go=true
          if [ "$EVENT" = "workflow_run" ]; then
            # only go on if the sync saved a new commit after it started (no news = nothing to translate)
            who=$(git log -1 --format=%an)
            when=$(git log -1 --format=%cI)
            if [ "$who" = "aurenstar-sync" ] && [ "$(date -d "$when" +%s)" -ge "$(date -d "$SYNC_STARTED" +%s)" ]; then go=true; else go=false; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.gate.outputs.go == 'true'
        run: npm install --legacy-peer-deps
      - name: Translate articles (skips quietly if the key is not set)
        if: steps.gate.outputs.go == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run articles:translate -- --max ${{ github.event_name == 'push' && '30' || '8' }}
      - name: Check before saving
        if: steps.gate.outputs.go == 'true'
        run: npx tsc --noEmit
      - name: Save
        if: steps.gate.outputs.go == 'true'
        run: |
          if [ -n "$(git status --porcelain data/article-translations)" ]; then
            git config user.name "aurenstar-bot"
            git config user.email "bot@aurenstar.com"
            git add data/article-translations
            git commit -m "Articles: new translations"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
