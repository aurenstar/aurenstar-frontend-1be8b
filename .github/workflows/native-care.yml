name: Native articles care
on:
  schedule:
    - cron: '11 12 * * 0'   # every Sunday: semaphore + better titles for articles seen but not clicked + retire the ones with no sign
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-articles
  cancel-in-progress: false
jobs:
  # Factory gate: the n8n factory decides if this routine may run (pause + per-routine switch in the database). Manual runs always go.
  porteiro:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.p.outputs.run }}
    steps:
      - id: p
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "push" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          R=$(curl -sS --max-time 30 -X POST "https://bnetpqdpeufookvvsnaj.supabase.co/rest/v1/rpc/site_github_pode_rodar" -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJuZXRwcWRwZXVmb29rdnZzbmFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NjMyMjQsImV4cCI6MjEwNjAzOTIyNH0.wt2vuHS_f4DirYlqrly-6BcA6FsmeL9mwemWm12n6hk" -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJuZXRwcWRwZXVmb29rdnZzbmFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NjMyMjQsImV4cCI6MjEwNjAzOTIyNH0.wt2vuHS_f4DirYlqrly-6BcA6FsmeL9mwemWm12n6hk" -H "Content-Type: application/json" -d '{"p_job":"native_care"}' || echo '{"run":false,"motivo":"sem resposta da fabrica"}')
          echo "Factory answer: $R"
          if echo "$R" | grep -Eq '"run": *true'; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
  care:
    needs: porteiro
    if: needs.porteiro.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - name: Report and care
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx tsx scripts/native/care.ts --apply
      - name: Check before saving
        run: npx tsc --noEmit
      - name: Save
        run: |
          if [ -n "$(git status --porcelain data/native-articles data/native-terms data/native-report.json data/native-report.md)" ]; then
            git config user.name "aurenstar-bot"
            git config user.email "bot@aurenstar.com"
            git add data/native-articles data/native-terms data/native-report.json data/native-report.md
            git commit -m "Native articles: weekly semaphore and care"
            git pull --rebase origin main
            git push
          fi
