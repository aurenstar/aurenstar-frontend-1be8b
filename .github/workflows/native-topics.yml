name: Native topics
on:
  schedule:
    - cron: '17 3 3 * *'   # monthly (day 3, after the n8n measurement on day 2)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - name: Pick topics per language (cheap filter only if the key is not set)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx tsx scripts/dictionary/nativeTopics.ts
      - name: Check
        run: npx tsc --noEmit
      - name: Save
        run: |
          if [ -n "$(git status --porcelain data/native-topics.json)" ]; then
            git config user.name "aurenstar-bot"
            git config user.email "bot@aurenstar.com"
            git add data/native-topics.json
            git commit -m "Native topics: strongest astrology searches per language"
            git pull --rebase origin main
            git push
          fi
