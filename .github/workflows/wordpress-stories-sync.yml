name: WordPress stories sync
# Every 2 hours and on demand: copies stories PUBLISHED in the WordPress Web Stories plugin into data/wp-stories
# (drafts are ignored). The commit makes Cloudflare rebuild the site, and they appear at aurenstar.com/blog/stories/<name>.
on:
  schedule:
    - cron: '41 */6 * * *'   # publishing in WordPress starts it at once; this is only the safety net
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wordpress-stories-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --legacy-peer-deps
      - name: Copy published stories
        env:
          WP_APP_PASSWORD: ${{ secrets.ROBO_WEBSTORIES }}
          WP_USER: oficialsafare
        run: npx tsx scripts/stories/syncWpStories.ts
      - name: Commit changes
        run: |
          git config user.name "aurenstar-sync"
          git config user.email "sync@aurenstar.com"
          git add data/wp-stories
          if ! git diff --cached --quiet; then
            git commit -m "Sync stories from WordPress"
            # the main branch moves often (other robots and merges), so catch up and try again a few times
            ok=0
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 6))
            done
            [ "$ok" = 1 ]
          fi
