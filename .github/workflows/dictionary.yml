name: Dictionary writer
on:
  schedule:
    - cron: '17 6 * * *'   # every day, a few new terms
  workflow_dispatch:
  push:
    branches: [seo-tecnico]
    paths: ['data/dictionary-run.trigger']   # touch this file to run it now
permissions:
  contents: write
jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-tecnico
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - name: Write new terms (skips quietly if the key is not set)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          MAX=5
          if [ "${{ github.event_name }}" = "push" ]; then
            MAX=$(grep -oE 'max=[0-9]+' data/dictionary-run.trigger | head -1 | cut -d= -f2)
            MAX=${MAX:-0}
          fi
          npm run dictionary:generate -- --max $MAX
      - name: Check before saving
        run: npx tsc --noEmit && npm run test:dictionary
      - name: Save
        run: |
          if [ -n "$(git status --porcelain src/data/dictionaryGenerated.json data/dictionary-failures.json)" ]; then
            git config user.name "aurenstar-bot"
            git config user.email "bot@aurenstar.com"
            git add src/data/dictionaryGenerated.json data/dictionary-failures.json
            git commit -m "Dictionary: new terms"
            git pull --rebase origin seo-tecnico
            git push
          fi
