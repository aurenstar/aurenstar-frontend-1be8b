name: Dictionary writer
on:
  schedule:
    - cron: '17 6 * * *'   # every day, up to 20 new terms
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/dictionary-run.trigger']   # touch this file to run it now
permissions:
  contents: write
jobs:
  # Factory gate: the n8n factory decides if this routine may run (pause + per-routine switch in the database). Manual runs always go.
  porteiro:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.p.outputs.run }}
    steps:
      - id: p
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "push" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          R=$(curl -sS --max-time 30 -X POST "https://bnetpqdpeufookvvsnaj.supabase.co/rest/v1/rpc/site_github_pode_rodar" -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJuZXRwcWRwZXVmb29rdnZzbmFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NjMyMjQsImV4cCI6MjEwNjAzOTIyNH0.wt2vuHS_f4DirYlqrly-6BcA6FsmeL9mwemWm12n6hk" -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJuZXRwcWRwZXVmb29rdnZzbmFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NjMyMjQsImV4cCI6MjEwNjAzOTIyNH0.wt2vuHS_f4DirYlqrly-6BcA6FsmeL9mwemWm12n6hk" -H "Content-Type: application/json" -d '{"p_job":"dictionary"}' || echo '{"run":false,"motivo":"sem resposta da fabrica"}')
          echo "Factory answer: $R"
          if echo "$R" | grep -Eq '"run": *true'; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
  write:
    needs: porteiro
    if: needs.porteiro.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --legacy-peer-deps
      - name: Most searched names in the 24 other languages
        run: npx tsx scripts/dictionary/worldNames.ts
      - name: Internal report (what works, what does not; never shown on the site)
        run: npx tsx scripts/dictionary/report.ts
      - name: Write new terms (skips quietly if the key is not set)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          MAX=20
          if [ "${{ github.event_name }}" = "push" ]; then
            MAX=$(grep -oE 'max=[0-9]+' data/dictionary-run.trigger | head -1 | cut -d= -f2)
            MAX=${MAX:-0}
          fi
          npm run dictionary:generate -- --max $MAX
      - name: Check before saving
        run: npx tsc --noEmit && npm run test:dictionary
      - name: Save
        run: |
          if [ -n "$(git status --porcelain src/data/dictionaryGenerated.json data/dictionary-failures.json data/dictionary-demand.json data/dictionary-report.json data/dictionary-report.md data/world-names.json)" ]; then
            git config user.name "aurenstar-bot"
            git config user.email "bot@aurenstar.com"
            git add src/data/dictionaryGenerated.json data/dictionary-failures.json data/dictionary-demand.json data/dictionary-report.json data/dictionary-report.md data/world-names.json
            git commit -m "Dictionary: new terms"
            git pull --rebase origin main
            git push
          fi
